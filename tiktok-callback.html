<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok Login — Video Factory</title>
<style>
  :root { --bg:#faf8f3; --ink:#1b1a17; --muted:#5e5a52; --accent:#c8481f; --box:#efebe2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --ink:#f3f0e8; --muted:#b3ada1; --accent:#ff8a5c; --box:#24221f; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.7 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:28px; line-height:1.3; margin:0 0 12px; }
  .muted { color:var(--muted); }
  code { display:block; direction:ltr; text-align:left; background:var(--box); padding:12px; border-radius:8px;
         word-break:break-all; font-size:15px; margin:12px 0; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 20px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">تسجيل الدخول بتيك توك</h1>
  <p id="msg" class="muted">جاري القراءة…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>انسخ الكود</button>
  <p class="muted" lang="en" dir="ltr">Video Factory — TikTok authorization callback. Copy the code above into the setup script.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    msg.textContent = "تم ✅ انسخ الكود ده والصقه في شاشة الأوامر (cmd) اللي مستنياه.";
    box.textContent = code; box.hidden = false; btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => { btn.textContent = "اتنسخ ✓"; });
  } else if (err) {
    document.getElementById("title").textContent = "تيك توك رفض الطلب";
    msg.textContent = (q.get("error_description") || err) + " — جرّب تاني أو ابعت الرسالة دي.";
  } else {
    msg.textContent = "الصفحة دي بتظهر الكود بعد تسجيل الدخول بتيك توك من سكريبت get_tiktok_token.py.";
  }
</script>
</body>
</html>
